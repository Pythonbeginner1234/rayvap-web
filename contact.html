<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | RAY Value Add Partners</title>
  <meta name="description" content="Contact RAY Value Add Partners to discuss a potential value-add improvement at your residential rental property.">
  <link rel="stylesheet" href="assets/css/style.css?v=contact-mobile-4">
</head>

<body>

<header class="site-header">

  <a class="brand" href="index.html" aria-label="RAY Value Add Partners home">
    <span class="ray">RAY</span>
    <span class="value-add">VALUE ADD PARTNERS</span>
  </a>

  <nav class="site-nav" aria-label="Primary navigation">
    <a href="index.html">Home</a>
    <a href="overview.html">Overview</a>
    <a href="how-it-works.html">How It Works</a>
    <a href="team.html">Team</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

</header>

<main class="page">

  <h1 class="page-title">Contact</h1>

<section class="contact-layout">

    <div class="contact-copy">
      <h2>Discuss a potential project</h2>

      <p>
        Interested in discussing a potential improvement at your property?
        Get in touch.
      </p>

      <div class="contact-copy-animation">
        <iframe
          class="contact-copy-animation-frame"
          src="contact-animation-final-dishwasher-v4.html"
          title="RAY Value Add Partners apartment improvement illustration"
          loading="eager"
          scrolling="no">
        </iframe>
      </div>
    </div>

    <form class="contact-form"
          action="https://api.web3forms.com/submit"
          method="POST">

      <input type="hidden" name="access_key" value="922eebb0-ce05-42f7-af4d-b9a1e2677087">
      <input type="hidden" name="subject" value="New RVAP website inquiry">
      <input type="hidden" name="flyer_batch" id="flyer-batch" value="direct">
      <input type="checkbox" name="botcheck" class="hidden" style="display:none;">
      <div class="form-field">
        <label for="contact-name">Name</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" required>
      </div>

      <div class="form-field">
        <label for="contact-reply">Email or phone</label>
        <input id="contact-reply" name="reply" type="text" required>
      </div>

      <div class="form-field">
        <label for="contact-property">Property address</label>
        <input id="contact-property" name="property" type="text" autocomplete="street-address">
      </div>

      <div class="form-field">
        <label for="contact-message">Tell us about the property or potential improvement</label>
        <textarea id="contact-message" name="message" rows="5"></textarea>
      </div>

      <button class="contact-submit" type="submit">Send inquiry</button>
    </form>

  </section>

</main>

<footer class="site-footer">
  <span>RAY Value Add Partners LLC</span>
  <div class="footer-contact">
    <a href="mailto:hello@rayvap.com">hello@rayvap.com</a>
    <a href="tel:+13475667644">347-566-7644</a>
  </div>
</footer>

<script>
  const contactForm = document.querySelector(".contact-form");
  const flyerSource = new URLSearchParams(window.location.search).get("src");

  if (flyerSource) {
    document.getElementById("flyer-batch").value = flyerSource;
  }

  contactForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const submitButton = contactForm.querySelector(".contact-submit");
    const originalText = submitButton.textContent;

    submitButton.disabled = true;
    submitButton.textContent = "Sending...";

    try {
      const response = await fetch(contactForm.action, {
        method: "POST",
        body: new FormData(contactForm)
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error("Submission failed");
      }

      contactForm.innerHTML = `
        <div>
          <h2 style="margin:0 0 14px;">Thank you.</h2>
          <p style="margin:0; line-height:1.6;">
            Your inquiry has been received. We'll be in touch.
          </p>
        </div>
      `;
    } catch (error) {
      submitButton.disabled = false;
      submitButton.textContent = originalText;
      alert("We couldn't send your inquiry. Please try again, or email hello@rayvap.com.");
    }
  });
</script>

<script src="assets/js/main.js"></script>
</body>
</html>
